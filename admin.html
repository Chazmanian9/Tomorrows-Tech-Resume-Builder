<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Tomorrows Tech Resume Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #050F23;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2878DC;
        }
        .login-box {
            background: #142B50;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            margin: 60px auto;
        }
        .login-box h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #2878DC;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            color: #333;
            margin-bottom: 12px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #2878DC;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { background: #1a5bb3; }
        .login-error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #142B50;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
        }
        .stat-card .num {
            font-size: 2rem;
            font-weight: 700;
            color: #2878DC;
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: #AAB3E6;
            margin-top: 4px;
        }
        .email-list {
            background: #142B50;
            border-radius: 10px;
            overflow: hidden;
        }
        .email-list table {
            width: 100%;
            border-collapse: collapse;
        }
        .email-list th {
            background: #0A1F3C;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.85rem;
            color: #AAB3E6;
            border-bottom: 1px solid #2878DC;
        }
        .email-list td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(40, 120, 220, 0.15);
            font-size: 0.9rem;
        }
        .email-list tr:hover td {
            background: rgba(40, 120, 220, 0.08);
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .actions button, .actions a {
            padding: 8px 16px;
            background: #2878DC;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
        }
        .actions button:hover, .actions a:hover { background: #1a5bb3; }
        .actions button.secondary {
            background: #142B50;
            border: 1px solid #2878DC;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #AAB3E6;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div class="login-box" id="loginBox">
            <h2>🔒 Admin Access</h2>
            <input type="password" id="adminPass" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">Login</button>
            <div class="login-error hidden" id="loginError">Wrong password.</div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <h1>📧 Subscriber Emails</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="num" id="totalCount">0</div>
                    <div class="label">Total Subscribers</div>
                </div>
            </div>
            <div class="actions">
                <button onclick="fetchEmails()">🔄 Refresh</button>
                <button class="secondary" onclick="copyEmails()">📋 Copy All Emails</button>
                <button class="secondary" onclick="exportCSV()">⬇️ Export CSV</button>
                <a href="/" style="margin-left:auto">← Back to Resume Builder</a>
            </div>
            <div class="email-list" id="emailListContainer">
                <div class="empty">Loading...</div>
            </div>
            <p style="text-align:center; margin-top:20px; font-size:0.75rem; color:#AAB3E6; opacity:0.6;">
                Produced by FC Consulting
            </p>
        </div>
    </div>

    <script>
        let cachedEmails = [];

        async function doLogin() {
            const pass = document.getElementById('adminPass').value;
            const err = document.getElementById('loginError');
            err.classList.add('hidden');

            try {
                const res = await fetch(`/api/subscribers?password=${encodeURIComponent(pass)}`);
                const data = await res.json();

                if (res.ok && data.success) {
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    cachedEmails = data.subscribers || [];
                    document.getElementById('totalCount').textContent = data.count || 0;
                    renderEmails(cachedEmails);
                    sessionStorage.setItem('adminPass', pass);
                } else {
                    err.classList.remove('hidden');
                }
            } catch (e) {
                err.textContent = 'Connection error.';
                err.classList.remove('hidden');
            }
        }

        async function fetchEmails() {
            const pass = sessionStorage.getItem('adminPass');
            if (!pass) return;
            try {
                const res = await fetch(`/api/subscribers?password=${encodeURIComponent(pass)}`);
                const data = await res.json();
                if (data.success) {
                    cachedEmails = data.subscribers || [];
                    document.getElementById('totalCount').textContent = data.count || 0;
                    renderEmails(cachedEmails);
                }
            } catch (e) {}
        }

        function renderEmails(emails) {
            const container = document.getElementById('emailListContainer');
            if (!emails.length) {
                container.innerHTML = '<div class="empty">No subscribers yet.</div>';
                return;
            }
            let html = '<table><thead><tr><th>#</th><th>Email</th><th>Subscribed Date</th></tr></thead><tbody>';
            emails.forEach((e, i) => {
                const date = new Date(e.created_at).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                html += `<tr><td>${i+1}</td><td>${e.email}</td><td>${date}</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function copyEmails() {
            const text = cachedEmails.map(e => e.email).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('Emails copied to clipboard!');
            });
        }

        function exportCSV() {
            let csv = 'Email,Subscribed Date\n';
            cachedEmails.forEach(e => {
                csv += `"${e.email}","${new Date(e.created_at).toISOString()}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'subscribers.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Auto-login if session has password
        const savedPass = sessionStorage.getItem('adminPass');
        if (savedPass) {
            document.getElementById('adminPass').value = savedPass;
            doLogin();
        }
    </script>
</body>
</html>
